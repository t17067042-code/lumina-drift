<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050510">
<title>Lumina Drift — Живой свет</title>
<link rel="manifest" href="manifest.json">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#050510; touch-action:none; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display:block; width:100%; height:100%; }
  #ui {
    position:fixed; inset:0; pointer-events:none; z-index:10;
    display:flex; flex-direction:column; justify-content:space-between;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  .top-bar {
    display:flex; justify-content:space-between; align-items:flex-start;
    padding-top:12px;
  }
  .score {
    color:#e0f7ff; font-size:28px; font-weight:700; text-shadow:0 0 20px #00f0ff;
    letter-spacing:-0.5px;
  }
  .score span { font-size:14px; opacity:0.7; display:block; font-weight:400; }
  .hint {
    color:rgba(200,240,255,0.6); font-size:13px; text-align:right; max-width:160px; line-height:1.3;
  }
  .bottom {
    text-align:center; padding-bottom:20px;
  }
  .power {
    display:inline-block; background:rgba(0,240,255,0.15); border:1px solid rgba(0,240,255,0.4);
    color:#a0f0ff; padding:6px 14px; border-radius:20px; font-size:12px; margin:0 4px;
  }
  #start-screen {
    position:fixed; inset:0; background:radial-gradient(ellipse at center, #0a1a2a 0%, #020208 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:100; color:white; text-align:center; padding:20px;
  }
  #start-screen h1 {
    font-size:42px; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg, #00f0ff, #a855f7, #f0abfc);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    margin-bottom:8px; text-shadow:0 0 40px rgba(0,240,255,0.5);
  }
  #start-screen p { color:rgba(200,230,255,0.75); font-size:15px; max-width:300px; line-height:1.5; margin-bottom:32px; }
  .btn {
    background:linear-gradient(135deg, #00d4ff, #7c3aed);
    border:none; color:white; font-size:18px; font-weight:600;
    padding:16px 48px; border-radius:50px; cursor:pointer;
    box-shadow:0 0 40px rgba(0,200,255,0.4); pointer-events:auto;
    transition:transform 0.15s;
  }
  .btn:active { transform:scale(0.96); }
  .features { display:flex; gap:12px; margin-top:28px; flex-wrap:wrap; justify-content:center; }
  .feat { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
          padding:8px 14px; border-radius:12px; font-size:12px; color:#c0e0ff; }
  #gameover {
    position:fixed; inset:0; background:rgba(5,5,16,0.92); display:none;
    flex-direction:column; align-items:center; justify-content:center; z-index:50; color:white;
  }
  #gameover h2 { font-size:32px; margin-bottom:8px; }
  #final-score { font-size:48px; color:#00f0ff; margin:16px 0; text-shadow:0 0 30px #00f0ff; }
</style>
</head>
<body>
<div id="start-screen">
  <h1>LUMINA DRIFT</h1>
  <p>Единственная игра, где мир растёт вместе с тобой.<br>Наклоняй телефон • проводи пальцем • создавай свет</p>
  <button class="btn" id="start-btn">Войти в свет</button>
  <div class="features">
    <div class="feat">Наклон = гравитация</div>
    <div class="feat">Жесты = сила</div>
    <div class="feat">Мир эволюционирует</div>
  </div>
</div>

<div id="ui" style="display:none">
  <div class="top-bar">
    <div class="score"><span>СВЕТ</span><div id="score-val">0</div></div>
    <div class="hint">Наклоняй телефон<br>Проводи пальцем<br>чтобы толкать</div>
  </div>
  <div class="bottom">
    <span class="power" id="nodes-count">Узлы: 0</span>
    <span class="power" id="level">Глубина: 1</span>
  </div>
</div>

<div id="gameover">
  <h2>Свет угас</h2>
  <div id="final-score">0</div>
  <p style="opacity:0.7;margin-bottom:24px">Твой мир оставил след</p>
  <button class="btn" id="restart-btn">Родиться заново</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ============ GAME STATE ============
let running = false;
let score = 0;
let depth = 1;
let nodes = [];
let particles = [];
let trails = [];
let gravity = {x:0, y:0.08};
let player = null;
let touch = {active:false, x:0, y:0, px:0, py:0};
let lastTime = 0;
let spawnTimer = 0;
let evolution = 0; // how much the world has changed

// Device orientation
let orient = {beta:0, gamma:0};
window.addEventListener('deviceorientation', e => {
  if (e.beta !== null) orient.beta = e.beta;
  if (e.gamma !== null) orient.gamma = e.gamma;
}, true);

// Request permission on iOS
async function requestOrient() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
  }
}

// ============ ENTITIES ============
class Player {
  constructor() {
    this.x = W/2; this.y = H*0.65;
    this.vx = 0; this.vy = 0;
    this.r = 14;
    this.energy = 100;
    this.glow = 0;
    this.trail = [];
  }
  update(dt) {
    // Tilt gravity
    const gx = (orient.gamma || 0) * 0.0018;
    const gy = ((orient.beta || 45) - 45) * 0.0015;
    this.vx += gx + gravity.x;
    this.vy += gy + gravity.y;

    // Touch push
    if (touch.active) {
      const dx = touch.x - this.x;
      const dy = touch.y - this.y;
      const dist = Math.hypot(dx, dy) || 1;
      const force = Math.min(0.45, 180 / dist);
      this.vx += (dx / dist) * force * 0.6;
      this.vy += (dy / dist) * force * 0.6;
    }

    // Damping
    this.vx *= 0.985;
    this.vy *= 0.985;

    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;

    // Soft walls
    if (this.x < this.r) { this.x = this.r; this.vx *= -0.6; }
    if (this.x > W - this.r) { this.x = W - this.r; this.vx *= -0.6; }
    if (this.y < this.r) { this.y = this.r; this.vy *= -0.6; }
    if (this.y > H - this.r) { this.y = H - this.r; this.vy *= -0.55; }

    this.trail.push({x:this.x, y:this.y, life:1});
    if (this.trail.length > 18) this.trail.shift();
    this.glow += (Math.random()-0.5)*0.08;
    this.glow = Math.max(0, Math.min(1, this.glow));
  }
  draw() {
    // Trail
    for (let i=0; i<this.trail.length; i++) {
      const t = this.trail[i];
      const a = i / this.trail.length;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.r * a * 0.7, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0, 240, 255, ${a*0.25})`;
      ctx.fill();
    }
    // Core glow
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r*4);
    g.addColorStop(0, `rgba(180,255,255,${0.55 + this.glow*0.2})`);
    g.addColorStop(0.4, `rgba(0,200,255,0.25)`);
    g.addColorStop(1, 'rgba(0,100,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r*4, 0, Math.PI*2);
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = '#e0ffff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 25;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Inner core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r*0.45, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }
}

class Node {
  constructor(x, y, type='normal') {
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*0.3;
    this.vy = (Math.random()-0.5)*0.3;
    this.r = 6 + Math.random()*5;
    this.type = type; // normal, attractor, repulsor, portal
    this.life = 1;
    this.pulse = Math.random()*Math.PI*2;
    this.connections = [];
    this.born = performance.now();
  }
  update(dt) {
    this.pulse += dt * 3;
    this.x += this.vx * dt * 40;
    this.y += this.vy * dt * 40;
    this.vx *= 0.99; this.vy *= 0.99;

    // Soft boundaries
    if (this.x < 20 || this.x > W-20) this.vx *= -1;
    if (this.y < 20 || this.y > H-20) this.vy *= -1;
  }
  draw() {
    const pulse = 0.7 + Math.sin(this.pulse)*0.3;
    let col = '#00f0ff';
    if (this.type === 'attractor') col = '#a855f7';
    if (this.type === 'repulsor') col = '#f97316';
    if (this.type === 'portal') col = '#f0abfc';

    // Connections (neural feel)
    ctx.lineWidth = 1;
    for (const other of this.connections) {
      const dist = Math.hypot(other.x-this.x, other.y-this.y);
      if (dist < 160) {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(other.x, other.y);
        ctx.strokeStyle = `rgba(100,200,255,${0.15 * (1-dist/160)})`;
        ctx.stroke();
      }
    }

    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r*3);
    g.addColorStop(0, col);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r*3*pulse, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = col;
    ctx.fill();
  }
}

class Particle {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*2;
    this.vy = (Math.random()-0.5)*2;
    this.life = 1;
    this.r = 1.5 + Math.random()*2;
    this.hue = 180 + Math.random()*60;
  }
  update(dt) {
    this.x += this.vx * dt * 50;
    this.y += this.vy * dt * 50;
    this.life -= dt * 0.8;
    this.vy += 0.02;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * this.life, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${this.life})`;
    ctx.fill();
  }
}

// ============ WORLD EVOLUTION ============
function evolveWorld() {
  evolution++;
  // Add new neural nodes that change the force field
  const types = ['normal','normal','attractor','repulsor'];
  if (evolution % 7 === 0) types.push('portal');
  const type = types[Math.floor(Math.random()*types.length)];
  const n = new Node(
    40 + Math.random()*(W-80),
    40 + Math.random()*(H-80),
    type
  );
  nodes.push(n);

  // Connect nearby
  for (const other of nodes) {
    if (other !== n && Math.hypot(other.x-n.x, other.y-n.y) < 180) {
      n.connections.push(other);
      other.connections.push(n);
    }
  }

  // Cap nodes for performance
  if (nodes.length > 28) {
    nodes.shift();
  }
  document.getElementById('nodes-count').textContent = 'Узлы: ' + nodes.length;
}

// ============ INPUT ============
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  touch.active = true;
  touch.x = t.clientX; touch.y = t.clientY;
  touch.px = t.clientX; touch.py = t.clientY;
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  touch.x = t.clientX; touch.y = t.clientY;
}, {passive:false});

canvas.addEventListener('touchend', () => { touch.active = false; });
canvas.addEventListener('touchcancel', () => { touch.active = false; });

// Mouse support for desktop testing
canvas.addEventListener('mousedown', e => {
  touch.active = true;
  touch.x = e.clientX; touch.y = e.clientY;
});
canvas.addEventListener('mousemove', e => {
  if (touch.active) { touch.x = e.clientX; touch.y = e.clientY; }
});
canvas.addEventListener('mouseup', () => touch.active = false);

// ============ GAME LOOP ============
function spawnEnergy() {
  // Occasional energy orbs that give score and evolve world
  if (Math.random() < 0.015 + depth*0.002) {
    const orb = {
      x: 30 + Math.random()*(W-60),
      y: 30 + Math.random()*(H-60),
      r: 9,
      pulse: Math.random()*6,
      collected: false
    };
    // store in particles for simplicity, but special
    particles.push({...orb, isOrb:true, life:1, vx:0, vy:0, hue:50});
  }
}

function update(dt) {
  if (!running) return;

  player.update(dt);

  // Node forces on player
  for (const n of nodes) {
    const dx = n.x - player.x;
    const dy = n.y - player.y;
    const dist = Math.hypot(dx, dy) || 1;
    if (dist < 220) {
      let strength = 0;
      if (n.type === 'attractor') strength = 0.12;
      if (n.type === 'repulsor') strength = -0.15;
      if (n.type === 'portal' && dist < 40) {
        // teleport mild
        player.vx += (Math.random()-0.5)*8;
        player.vy += (Math.random()-0.5)*8;
        score += 5;
      }
      player.vx += (dx/dist) * strength * (1 - dist/220);
      player.vy += (dy/dist) * strength * (1 - dist/220);
    }
    n.update(dt);
  }

  // Particles / orbs
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    if (p.isOrb) {
      p.pulse += dt*4;
      const dx = player.x - p.x;
      const dy = player.y - p.y;
      if (Math.hypot(dx,dy) < player.r + p.r + 8) {
        // collect
        score += 25 + depth*3;
        evolveWorld();
        depth = 1 + Math.floor(score / 180);
        document.getElementById('level').textContent = 'Глубина: ' + depth;
        document.getElementById('score-val').textContent = score;
        // burst
        for (let k=0;k<12;k++) {
          particles.push(new Particle(p.x, p.y));
        }
        particles.splice(i,1);
        continue;
      }
    } else {
      p.update(dt);
      if (p.life <= 0) particles.splice(i,1);
    }
  }

  spawnEnergy();

  // Gentle ambient particles
  if (Math.random() < 0.3) {
    particles.push(new Particle(Math.random()*W, Math.random()*H));
  }

  // Soft fail condition - if player energy or just keep endless for now
  // Endless mode: only visual feedback
}

function draw() {
  // Background with subtle nebula
  ctx.fillStyle = '#050510';
  ctx.fillRect(0,0,W,H);

  // Soft vignette + depth color shift
  const grd = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
  grd.addColorStop(0, `hsla(${200 + depth*8}, 40%, 8%, 0.4)`);
  grd.addColorStop(1, 'rgba(5,5,16,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0,0,W,H);

  // Draw nodes (neural field)
  for (const n of nodes) n.draw();

  // Particles
  for (const p of particles) {
    if (p.isOrb) {
      const pulse = 0.8 + Math.sin(p.pulse)*0.25;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 22);
      g.addColorStop(0, 'rgba(255,230,100,0.9)');
      g.addColorStop(0.5, 'rgba(255,180,50,0.3)');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 22*pulse, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, 7, 0, Math.PI*2);
      ctx.fillStyle = '#fff8c0';
      ctx.fill();
    } else {
      p.draw();
    }
  }

  // Touch force visualization
  if (touch.active && player) {
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(touch.x, touch.y);
    ctx.strokeStyle = 'rgba(0,240,255,0.25)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(touch.x, touch.y, 18, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(0,240,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  if (player) player.draw();
}

function loop(t) {
  const dt = Math.min(0.033, (t - lastTime)/1000 || 0.016);
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ============ START / RESTART ============
function startGame() {
  requestOrient();
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('ui').style.display = 'flex';
  document.getElementById('gameover').style.display = 'none';
  running = true;
  score = 0;
  depth = 1;
  nodes = [];
  particles = [];
  evolution = 0;
  player = new Player();
  document.getElementById('score-val').textContent = '0';
  document.getElementById('nodes-count').textContent = 'Узлы: 0';
  document.getElementById('level').textContent = 'Глубина: 1';

  // Seed initial neural field
  for (let i=0; i<6; i++) evolveWorld();
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// Start render loop immediately
requestAnimationFrame(loop);

// Prevent scroll / bounce
document.body.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
</script>
</body>
</html>
